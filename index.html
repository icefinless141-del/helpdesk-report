<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk Daily Report</title>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0078d4">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        body { 
            font-family: sans-serif; 
            max-width: 600px; 
            margin: 15px auto; 
            padding: 15px; 
            background: #f9f9f9; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        h2 { font-size: 22px; text-align: center; color: #333; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 16px; color: #333; }
        input[type="text"], input[type="datetime-local"], input[type="time"], select, textarea, input[type="file"] { 
            width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; background: #fff;
        }
        textarea { height: 120px; }
        
        /* สไตล์สำหรับกล่อง Ticket รวมร่าง */
        .ticket-input-group {
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow: hidden;
        }
        .ticket-prefix-badge {
            background: #eee;
            color: #444;
            padding: 12px;
            font-weight: bold;
            font-size: 15px;
            border-right: 1px solid #ccc;
            white-space: nowrap;
        }
        .ticket-input-group input {
            border: none !important;
            border-radius: 0 !important;
            padding: 12px;
        }

        button { 
            background: #0078d4; color: white; border: none; padding: 14px 15px; cursor: pointer; border-radius: 6px; font-size: 18px; width: 100%; font-weight: bold;
        }
        button:hover { background: #106ebe; }
        #loading { display: none; text-align: center; color: #0078d4; margin-top: 15px; font-weight: bold; font-size: 16px; }
        .user-badge { 
            background: #e1dfdd; padding: 12px; border-radius: 6px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; font-size: 16px; font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>ระบบบันทึกงานรายวัน (Helpdesk)</h2>

    <!-- ส่วนเลือกผู้ใช้งาน -->
    <div id="loginSection" class="form-group">
        <label>เลือกชื่อผู้ใช้งาน:</label>
        <select id="userSelect">
            <option value="">-- กรุณาเลือกชื่อของคุณ --</option>
            <option value="ชาญชัย จันทร์โทน">ชาญชัย จันทร์โทน</option>
            <option value="ศณิพัฒณ์ ยิ้มเจริญ">ศณิพัฒณ์ ยิ้มเจริญ</option>
            <option value="พรพงศ์พันธ์ ศรีจันเอี่ยม">พรพงศ์พันธ์ ศรีจันเอี่ยม</option>
        </select>
        <br><br>
        <button type="button" onclick="login()">เข้าสู่ระบบ</button>
    </div>

    <!-- ส่วนฟอร์มคีย์งาน -->
    <form id="helpdeskForm" style="display: none;">
        <div class="user-badge">
            <span id="displayUser"></span>
            <button type="button" onclick="logout()" style="width: auto; padding: 6px 12px; background: #a80000; font-size: 14px;">เปลี่ยนผู้ใช้</button>
        </div>

        <div class="form-group">
            <label>วันและเวลาบันทึกงาน:</label>
            <input type="datetime-local" id="timestamp" required onchange="updateTicketPrefix()">
        </div>

        <div class="form-group">
            <label>เลขที่ Ticket (เว้นว่างได้ถ้าไม่มี):</label>
            <div class="ticket-input-group">
                <span class="ticket-prefix-badge" id="ticketPrefixDisplay">BK-YYYYMMDD-</span>
                <input type="text" id="ticketSuffix" placeholder="เช่น 8792 (ถ้ามี)">
            </div>
        </div>

        <!-- ส่วนเลือก OT (ล่วงเวลา) -->
        <div class="form-group" style="background: #eef6fc; padding: 15px; border-radius: 6px; border: 1px dashed #0078d4;">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; margin-bottom: 0;">
                <input type="checkbox" id="isOT" onchange="toggleOTFields()" style="width: 20px; height: 20px;">
                <span style="color: #0078d4; font-size: 16px;">เป็นการทำ OT (ล่วงเวลา)</span>
            </label>
            
            <div id="otTimeSection" style="display: none; margin-top: 12px; gap: 10px;">
                <div style="flex: 1;">
                    <label style="font-size: 14px; font-weight: normal;">เวลาเริ่ม OT:</label>
                    <input type="time" id="otStart">
                </div>
                <div style="flex: 1;">
                    <label style="font-size: 14px; font-weight: normal;">เวลาเลิก OT:</label>
                    <input type="time" id="otEnd">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>ชื่องาน / หัวข้อ:</label>
            <input type="text" id="title" required>
        </div>
        <div class="form-group">
            <label>รายละเอียดงาน:</label>
            <textarea id="detail" required></textarea>
        </div>
        <div class="form-group">
            <label>แนบรูปภาพหลักฐาน (เลือกได้หลายรูป):</label>
            <input type="file" id="imageFiles" accept="image/*" multiple required>
        </div>
        <button type="submit" id="submitBtn">บันทึกส่งข้อมูลเข้า Google Drive</button>
        <div id="loading">กำลังอัปโหลดข้อมูลและรูปภาพ กรุณารอสักครู่...</div>
    </form>

    <script>
        const USER_WEBHOOKS = {
            "ชาญชัย จันทร์โทน": "https://script.google.com/macros/s/AKfycbyfvv9I0F_fu_GlM5QAq2FKq_P1T0f2NBge-X-VcnEYMHdHSkSPkclxRI81_u-vKpwj/exec",
            "ศณิพัฒณ์ ยิ้มเจริญ": "https://script.google.com/macros/s/AKfycbyO_3LJ2d4J34Y40ThQZW30ABTUtRGyE53YFBsY8WFB-4_4d74x41QTE0AHMKDlAycm/exec",
            "พรพงศ์พันธ์ ศรีจันเอี่ยม": "https://script.google.com/macros/s/AKfycbzxre-UUi7x7eAYtE5r5xP67mBol9RtROAdMbpKv7iTPx5ok-6x9yKQ4r1uzRfpCkCw/exec"
        };

        let currentUser = "";
        let currentWebhookUrl = "";
        let currentPrefix = "";

        function toggleOTFields() {
            const isChecked = document.getElementById('isOT').checked;
            document.getElementById('otTimeSection').style.display = isChecked ? 'flex' : 'none';
        }

        function updateTicketPrefix() {
            const val = document.getElementById('timestamp').value;
            if (!val) return;
            
            const datePart = val.split('T')[0];
            const parts = datePart.split('-');
            const year = parts[0];
            const month = parts[1];
            const day = parts[2];
            
            currentPrefix = `BK-${year}${month}${day}-`;
            document.getElementById('ticketPrefixDisplay').innerText = currentPrefix;
        }

        function setCurrentDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('timestamp').value = `${year}-${month}-${day}T${hours}:${minutes}`;
            updateTicketPrefix();
        }

        function login() {
            const select = document.getElementById('userSelect');
            if (!select.value) {
                alert('กรุณาเลือกชื่อผู้ใช้งานก่อนครับ');
                return;
            }
            currentUser = select.value;
            currentWebhookUrl = USER_WEBHOOKS[currentUser];

            document.getElementById('displayUser').innerText = 'ผู้ใช้งาน: ' + currentUser;
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('helpdeskForm').style.display = 'block';
            
            setCurrentDateTime();
        }

        function logout() {
            currentUser = "";
            currentWebhookUrl = "";
            document.getElementById('helpdeskForm').reset();
            document.getElementById('isOT').checked = false;
            toggleOTFields();
            document.getElementById('helpdeskForm').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        document.getElementById('helpdeskForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const timestamp = document.getElementById('timestamp').value;
            const suffix = document.getElementById('ticketSuffix').value.trim();
            
            let fullTicket = "";
            if (suffix !== "") {
                fullTicket = currentPrefix + suffix;
            } else {
                fullTicket = "-";
            }

            const isOT = document.getElementById('isOT').checked;
            const otStart = document.getElementById('otStart').value;
            const otEnd = document.getElementById('otEnd').value;

            if (isOT && (!otStart || !otEnd)) {
                return alert('กรุณากำหนดเวลาเริ่มและเวลาเลิก OT ให้ครบถ้วนครับ');
            }

            const title = document.getElementById('title').value;
            const detail = document.getElementById('detail').value;
            const fileInput = document.getElementById('imageFiles');
            
            if (fileInput.files.length === 0) {
                return alert('กรุณาเลือกรูปภาพหลักฐานอย่างน้อย 1 รูป');
            }

            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';

            try {
                const filesArray = [];
                for (let i = 0; i < fileInput.files.length; i++) {
                    const file = fileInput.files[i];
                    const base64Data = await toBase64(file);
                    filesArray.push({
                        filename: file.name,
                        filedata: base64Data
                    });
                }

                const payload = {
                    timestamp: timestamp,
                    ticket: fullTicket,
                    user: currentUser,
                    title: title,
                    detail: detail,
                    isOT: isOT,
                    otTime: isOT ? `${otStart} - ${otEnd}` : "-",
                    files: filesArray
                };

                const response = await fetch(currentWebhookUrl, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('บันทึกงานและอัปโหลดรูปภาพสำเร็จ!');
                    document.getElementById('helpdeskForm').reset();
                    document.getElementById('isOT').checked = false;
                    toggleOTFields();
                    document.getElementById('helpdeskForm').style.display = 'none';
                    document.getElementById('loginSection').style.display = 'block';
                } else {
                    alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้');
            } finally {
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker Registered!', reg))
                    .catch(err => console.log('Service Worker Registration Failed!', err));
            });
        }
    </script>
</body>
</html>
